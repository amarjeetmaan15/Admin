name: Build Admin APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      application_id:
        description: "Android applicationId (defaults to com.admin)"
        required: false
        default: "com.admin"
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Select application ID
        run: |
          APP_ID="${{ inputs.application_id || vars.APP_APPLICATION_ID || 'com.admin' }}"
          echo "APP_APPLICATION_ID=$APP_ID" >> "$GITHUB_ENV"
      - name: Decode owner signing key when configured
        env:
          KEYSTORE_B64: ${{ secrets.TESTING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ADMIN_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ADMIN_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ADMIN_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::Permanent signing secrets are not configured. Building with the runner's temporary Android debug key. This APK is for testing only and cannot safely update an installation signed with another key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/testing.jks"
          keytool -list -keystore "$RUNNER_TEMP/testing.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "TESTING_KEYSTORE_PATH=$RUNNER_TEMP/testing.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle assembleDebug -PappVersionCode=${{ github.run_number }} -PAPP_APPLICATION_ID="$APP_APPLICATION_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: Admin-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
      - name: Publish repository release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" app/build/outputs/apk/debug/*.apk --repo "$GITHUB_REPOSITORY" --title "Admin build ${{ github.run_number }}" --notes "Automated Admin APK build."